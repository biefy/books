[book]
title = "Practical eBPF in 30 Days"
authors = ["biefy"]
description = "A hands-on, experiment-driven path through modern eBPF on Linux 7.1. Head First style. Builds on kernel-internals knowledge."
language = "en"
src = "src"

[output.html]
default-theme = "light"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/biefy/books"
edit-url-template = "https://github.com/biefy/books/edit/main/ebpf/{path}"
site-url = "/books/ebpf/"
mathjax-support = false
no-section-label = false
fold = { enable = true, level = 1 }
playground = { editable = false, copyable = true }
additional-css = [
  "src/lightbox.css",
  "src/kernel-source.css",
  "src/language-switcher.css",
  "src/pagefind-search.css",
]
additional-js = [
  "src/lightbox.js",
  "src/kernel-source.js",
  "src/language-switcher.js",
  "src/pagefind-search.js",
]

[output.html.search]
enable = false

[output.html.print]
enable = true
