name: Validate bilingual books

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bilingual-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install mdbook
        run: |
          mkdir -p $HOME/.local/bin
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.3/mdbook-v0.5.3-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C $HOME/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install pinned Pagefind
        run: npm ci --ignore-scripts

      - name: Check script syntax
        run: |
          bash -n scripts/build-site.sh render-diagrams.sh
          python3 -m py_compile scripts/check-i18n.py scripts/check-site.py

      - name: Check translation parity and source locks
        run: python3 scripts/check-i18n.py check

      - name: Build English and Chinese books and index with Pagefind
        run: ./scripts/build-site.sh

      - name: Smoke-test links, assets, locales, and multilingual search
        run: |
          python3 scripts/check-site.py _site
          node scripts/check-search.mjs _site
