[book]
title = "Linux Network Subsystem in 30 Days"
authors = ["biefy"]
description = "A hands-on, experiment-driven path through the Linux kernel network stack. Head First style. Verified against kernel 7.x."
language = "en"
src = "src"

[output.html]
default-theme = "rust"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/biefy/books"
edit-url-template = "https://github.com/biefy/books/edit/main/linux-net/{path}"
site-url = "/books/linux-net/"
mathjax-support = false
no-section-label = false
fold = { enable = true, level = 1 }
playground = { editable = false, copyable = true }
additional-css = ["src/lightbox.css"]
additional-js = ["src/lightbox.js"]

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 2

[output.html.print]
enable = true
