[book]
title = "Linux Network Subsystem in 30 Days"
authors = ["biefy"]
description = "A hands-on, experiment-driven path through the Linux kernel network stack. Head First style. Verified against kernel 7.1."
language = "en"
src = "src"

[output.html]
default-theme = "light"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/biefy/books"
edit-url-template = "https://github.com/biefy/books/edit/main/linux-net/{path}"
site-url = "/books/linux-net/"
mathjax-support = false
no-section-label = false
fold = { enable = true, level = 1 }
playground = { editable = false, copyable = true }
additional-css = [
  "src/lightbox.css",
  "src/kernel-source.css",
  "src/language-switcher.css",
  "src/pagefind-search.css",
]
additional-js = [
  "src/lightbox.js",
  "src/kernel-source.js",
  "src/language-switcher.js",
  "src/pagefind-search.js",
]

[output.html.search]
enable = false

[output.html.print]
enable = true
